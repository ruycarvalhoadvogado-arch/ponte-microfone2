<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gravação de áudio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #18120D;
    color: #F2E4C3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #status { font-size: 15px; margin-bottom: 22px; }
  #ponto {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #C0645C;
    margin-right: 8px;
    animation: piscar 1s infinite;
  }
  @keyframes piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  button {
    background: #A9772A;
    color: #1E1608;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  p.aviso { font-size: 12px; color: #B8A588; margin-top: 24px; max-width: 320px; }
</style>
</head>
<body>
  <div id="status">Pedindo acesso ao microfone...</div>
  <button id="botao-parar" onclick="pararGravacao()" disabled>Parar e enviar</button>
  <p class="aviso">Essa janela só grava e envia o áudio de volta para o aplicativo que a abriu. Nada fica salvo aqui.</p>

  <script>
    let gravador = null;
    let pedacos = [];

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      pedacos = [];
      gravador = new MediaRecorder(stream);

      gravador.ondataavailable = function (evento) {
        pedacos.push(evento.data);
      };

      gravador.onstop = function () {
        stream.getTracks().forEach(function (faixa) { faixa.stop(); });
        const blob = new Blob(pedacos, { type: 'audio/webm' });
        const leitor = new FileReader();
        leitor.onload = function () {
          if (window.opener) {
            // Usa '*' aqui de propósito: quem decide se aceita ou não essa
            // mensagem é o aplicativo principal, conferindo a origem dela.
            window.opener.postMessage({ tipo: 'AUDIO_GRAVADO', dadosBase64: leitor.result }, '*');
          }
          document.getElementById('status').textContent = 'Enviado. Essa janela vai fechar sozinha.';
          setTimeout(function () { window.close(); }, 700);
        };
        leitor.readAsDataURL(blob);
      };

      gravador.start();
      document.getElementById('status').innerHTML = '<span id="ponto"></span>Gravando...';
      document.getElementById('botao-parar').disabled = false;
    }).catch(function (erro) {
      document.getElementById('status').textContent = 'Não consegui acessar o microfone: ' + erro.message;
    });

    function pararGravacao() {
      if (gravador && gravador.state === 'recording') {
        gravador.stop();
        document.getElementById('botao-parar').disabled = true;
        document.getElementById('status').textContent = 'Processando...';
      }
    }
  </script>
</body>
</html>
